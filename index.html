<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181c">
<title>Loverboy O'Clock</title>
<meta name="description" content="Run through seven worlds to unlock TD's Loverboy O'Clock, one track at a time.">
<meta property="og:type" content="website">
<meta property="og:title" content="Loverboy O'Clock">
<meta property="og:description" content="Run through seven worlds to unlock TD's new tape, one track at a time.">
<meta property="og:url" content="https://hansbuntu.github.io/loverboy-game/">
<meta property="og:image" content="https://hansbuntu.github.io/loverboy-game/assets/share/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/pixelify-sans-700.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/dm-serif-display.woff2" crossorigin>
<link rel="preload" as="image" href="assets/backgrounds/level-01.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <h1 class="sr" id="srTitle">Loverboy O'Clock</h1>

  <div class="stage" id="stage" data-state="start">
    <canvas id="game" width="640" height="400" aria-label="Game"></canvas>

    <div class="hud" id="hud">
      <span class="hud-level" id="levelLabel">Level 1 of 7</span>
      <span class="hud-hearts" id="hudHearts" aria-label="Hearts"><i></i><i></i><i></i></span>
      <span class="hud-right">
        <span class="hud-count" id="progressLabel">0 / 8</span>
        <button class="hud-pause" id="pauseBtn" type="button" aria-label="Pause"><span></span><span></span></button>
      </span>
      <div class="hud-bar"><div class="hud-bar-fill" id="hudBar"></div></div>
    </div>

    <div class="countdown" id="countdown" aria-live="polite"></div>

    <!-- start screen, level intro / fail card, pause menu and the end screen share this layer -->
    <div class="overlay hide" id="overlay" data-mode="start">
      <div class="ov ov-start">
        <div class="brand-heart" aria-hidden="true">
          <svg viewBox="0 0 9 8" shape-rendering="crispEdges"><path fill="currentColor" d="M1 0h2v1h1v1h1V1h1V0h2v1h1v3H8v1H7v1H6v1H5v1H4V7H3V6H2V5H1V4H0V1h1z"/></svg>
        </div>
        <h2 class="brand" id="brandTitle">Loverboy O'Clock</h2>
        <p class="tagline" id="brandTagline"></p>
        <p class="howto" id="howTo"></p>
        <p class="begin">Tap to begin</p>
      </div>

      <div class="ov ov-card">
        <img class="card-tile" id="cardTile" alt="">
        <h2 class="card-title" id="cardTitle"></h2>
        <div class="card-meter" id="cardMeter"><i id="cardMeterFill"></i></div>
        <div class="card-pips" id="cardPips" aria-hidden="true"></div>
        <p class="card-text" id="cardText"></p>
      </div>

      <div class="ov ov-pause" role="dialog" aria-label="Paused">
        <h2 class="pause-title">Paused</h2>
        <button class="btn btn-primary" id="resumeBtn" type="button">Resume</button>
        <div class="pause-row">
          <button class="chip" type="button" data-toggle="sound" aria-pressed="true">Sound</button>
          <button class="chip" type="button" data-toggle="haptics" aria-pressed="true">Vibration</button>
        </div>
        <button class="link" id="restartBtn" type="button">Restart level</button>
      </div>

      <div class="ov ov-finale">
        <canvas class="fx" id="finaleFx" aria-hidden="true"></canvas>
        <div class="finale-col">
          <div class="heart-badge" aria-hidden="true">
            <svg viewBox="0 0 9 8" width="38" height="34" shape-rendering="crispEdges"><path fill="currentColor" d="M1 0h2v1h1v1h1V1h1V0h2v1h1v3H8v1H7v1H6v1H5v1H4V7H3V6H2V5H1V4H0V1h1z"/></svg>
          </div>
          <h2 class="finale-heading">You unlocked the whole tape.</h2>
          <p class="finale-body">Thank you for playing through it all.</p>
          <div class="finale-tape" id="finaleTape" aria-hidden="true"></div>
          <p class="finale-hearts" id="finaleHearts"></p>
        </div>
        <div class="finale-divider"></div>
        <div class="finale-col">
          <p class="finale-cta">Want early access?</p>
          <p class="finale-sub">Drop your email for the release link before it's public.</p>
          <form id="emailForm" novalidate>
            <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email" aria-label="Email address">
            <p class="finale-error" id="emailError" role="alert"></p>
            <button class="btn btn-primary" type="submit">Get early access</button>
          </form>
          <p class="finale-success" id="emailSuccess" role="status"></p>
          <button class="btn btn-ghost" id="playAgainBtn" type="button">Play again</button>
        </div>
      </div>
    </div>

    <!-- the "Track unlocked" card -->
    <div class="reveal" id="reveal">
      <div class="reveal-rays" aria-hidden="true"></div>
      <canvas class="fx" id="revealFx" aria-hidden="true"></canvas>
      <div class="reveal-card">
        <div class="reveal-art">
          <div class="vinyl" aria-hidden="true"><span class="vinyl-label"></span></div>
          <img class="reveal-tile" id="revealTile" alt="" src="assets/tiles/tile-01.png">
          <span class="reveal-num" id="revealNum">01</span>
        </div>
        <p class="reveal-label">Track unlocked</p>
        <h2 class="reveal-title" id="revealTitle"></h2>
        <p class="reveal-hearts" id="revealHearts" aria-hidden="true"></p>
        <p class="reveal-hint"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Playing a preview &middot; tap to skip</p>
        <div class="reveal-progress"><div class="reveal-progress-fill" id="revealProgress"></div></div>
      </div>
    </div>

    <div class="loader" id="loader" role="status" aria-label="Loading">
      <div class="loader-heart" aria-hidden="true">
        <svg viewBox="0 0 9 8" shape-rendering="crispEdges"><path fill="currentColor" d="M1 0h2v1h1v1h1V1h1V0h2v1h1v3H8v1H7v1H6v1H5v1H4V7H3V6H2V5H1V4H0V1h1z"/></svg>
      </div>
      <div class="loader-bar"><i id="loaderFill"></i></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h3>Tracklist</h3>
      <span class="panel-count" id="panelCount"></span>
      <span class="panel-tools">
        <button class="icon-btn" type="button" data-toggle="sound" aria-label="Sound" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M3 7h3l4-3.5v13L6 13H3z"/><path class="on" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M13 7.2a4 4 0 0 1 0 5.6M15.3 5a7 7 0 0 1 0 10"/><path class="off" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M13 7l5 6M18 7l-5 6"/></svg></button>
        <button class="icon-btn" type="button" data-toggle="haptics" aria-label="Vibration" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6.5" y="3" width="7" height="14" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path class="on" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M3.5 7v6M1.5 8.5v3M16.5 7v6M18.5 8.5v3"/><path class="off" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M2 18L18 2"/></svg></button>
      </span>
    </div>
    <div class="tracks" id="tracks"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
